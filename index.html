<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Stream</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>      
        
    <h1>Log Stream</h1>
    <div>Live developer observability Dashboard</div>

    
    <section class="control">
    
    <div>
    <label for="clientId">Name / Client ID</label>
    <input type="text" id="clientId" placeholder="Enter Client ID">
    </div>

    <button id="start">Start stream</button>
    <button id="stop" disabled>Stop stream</button>

    <div class="status">

        <span id="statusindicator"></span>
        <span id="statustext">
            Disconnected
        </span>

    </div>

    </section>

    <section class="terminal">
    <h2>Live Stream</h2>
    <div id="terminal">
        <div class="logline">
    </div>
    </div>
    </section>

    </main>
    <script src="script.js"></script>
</body>
</html>
